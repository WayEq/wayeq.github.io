<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker News Popular Topics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
    }
    h1 {
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
    }
    a {
      text-decoration: none;
      color: #0073e6;
    }
    a:hover {
      text-decoration: underline;
    }
    .loading {
      text-align: center;
      font-size: 20px;
    }
    .comments-link {
      margin-left: 10px;
      color: #ff6600;
    }
    .domain {
      color: gray;
      font-size: 0.9em;
      margin-left: 5px;
    }
    .open-both {
      margin-left: 10px;
      color: gray;
      font-size: 0.85em;
      cursor: pointer;
    }
    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #fff;
      flex-direction: column;
    }
    #viewer.open { display: flex; }
    #viewerBar {
      padding: 8px 12px;
      background: #f4f4f9;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    #viewerTitle { flex: 1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #viewerFrame { flex: 1 1 55%; border: 0; min-height: 0; width: 100%; }
    #viewerComments {
      flex: 1 1 45%;
      min-height: 0;
      overflow-y: auto;
      border-top: 3px solid #ff6600;
      padding: 8px 12px;
      font-size: 0.9em;
    }
    .comment .comment {
      margin-left: 16px;
      padding-left: 10px;
      border-left: 1px solid #ddd;
    }
    .comment { margin: 8px 0; }
    .author { color: gray; font-size: 0.85em; }
    #viewerComments p { margin: 4px 0; }
    #viewerComments pre { overflow-x: auto; }
    .controls {
      margin-bottom: 20px;
      text-align: center;
    }
    select {
      padding: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>Hacker News Popular Topics</h1>

<div class="controls">
  <label for="commentFilter">Minimum Comments: </label>
  <select id="commentFilter">
    <option value="50">50</option>
    <option value="100" selected>100</option>
    <option value="200">200</option>
  </select>
  <label for="sortBy" style="margin-left: 15px;">Sort: </label>
  <select id="sortBy">
    <option value="comments" selected>Comments</option>
    <option value="velocity">Velocity</option>
    <option value="newest">Newest</option>
  </select>
</div>

<p class="loading">Loading stories...</p>
<ul id="stories"></ul>

<div id="viewer">
  <div id="viewerBar">
    <span id="viewerTitle"></span>
    <a id="viewerOpenArticle" target="_blank" rel="noopener">article in new tab ↗</a>
    <a id="viewerClose" style="cursor:pointer">close ✕</a>
  </div>
  <iframe id="viewerFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  <div id="viewerComments"></div>
</div>

<script>
  const HOT_VELOCITY = 40; // comments per hour (avg since posted) that earns a 🔥
  const HN = 'https://hacker-news.firebaseio.com/v0';
  let allStories = [];

  async function fetchJson(url) {
    const response = await fetch(url);
    return response.json();
  }

  function getDomainFromUrl(url) {
    try {
      return new URL(url).hostname.replace('www.', '');
    } catch (e) {
      return '';
    }
  }

  function commentsUrl(story) {
    return `https://news.ycombinator.com/item?id=${story.id}`;
  }

  function velocityOf(story) {
    const hours = Math.max((Date.now() / 1000 - story.time) / 3600, 0.25);
    return (story.descendants || 0) / hours;
  }

  // Keep only simple formatting from comment HTML (HN text is already filtered; this is belt and braces)
  function cleanHtml(html) {
    const doc = new DOMParser().parseFromString(html || '', 'text/html');
    const allowed = new Set(['P', 'A', 'I', 'EM', 'PRE', 'CODE', 'BR']);
    (function walk(node) {
      for (const child of [...node.children]) {
        if (!allowed.has(child.tagName)) {
          child.replaceWith(document.createTextNode(child.textContent));
          continue;
        }
        for (const attr of [...child.attributes]) {
          if (!(child.tagName === 'A' && attr.name === 'href')) child.removeAttribute(attr.name);
        }
        if (child.tagName === 'A') {
          if (!/^https?:/i.test(child.getAttribute('href') || '')) child.removeAttribute('href');
          child.target = '_blank';
          child.rel = 'noopener';
        }
        walk(child);
      }
    })(doc.body);
    return doc.body.innerHTML;
  }

  function renderComment(c) {
    const div = document.createElement('div');
    div.className = 'comment';
    const who = document.createElement('div');
    who.className = 'author';
    who.textContent = c.author || '[deleted]';
    const body = document.createElement('div');
    body.innerHTML = cleanHtml(c.text);
    div.appendChild(who);
    div.appendChild(body);
    for (const child of c.children || []) {
      if (child.text) div.appendChild(renderComment(child));
    }
    return div;
  }

  async function openViewer(story) {
    const viewer = document.getElementById('viewer');
    const frame = document.getElementById('viewerFrame');
    const panel = document.getElementById('viewerComments');
    document.getElementById('viewerTitle').textContent = story.title;
    const articleLink = document.getElementById('viewerOpenArticle');
    if (story.url) {
      articleLink.href = story.url;
      articleLink.style.display = '';
      frame.style.display = '';
      frame.src = story.url; // sites that forbid framing will show blank/refused; use the new-tab link
    } else {
      articleLink.style.display = 'none';
      frame.style.display = 'none'; // Ask HN etc: the post text is in the comments pane
      frame.removeAttribute('src');
    }
    viewer.classList.add('open');
    panel.textContent = 'Loading comments...';
    try {
      const item = await fetchJson(`https://hn.algolia.com/api/v1/items/${story.id}`);
      panel.textContent = '';
      if (!story.url && item.text) {
        const post = document.createElement('div');
        post.innerHTML = cleanHtml(item.text);
        panel.appendChild(post);
      }
      for (const c of item.children || []) {
        if (c.text) panel.appendChild(renderComment(c));
      }
      if (!panel.hasChildNodes()) panel.textContent = 'No comments.';
    } catch (e) {
      panel.textContent = 'Could not load comments.';
    }
  }

  function closeViewer() {
    document.getElementById('viewer').classList.remove('open');
    document.getElementById('viewerFrame').removeAttribute('src');
  }
  document.getElementById('viewerClose').addEventListener('click', closeViewer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });

  async function loadStories() {
    const ids = (await fetchJson(`${HN}/topstories.json`)).slice(0, 100);
    const items = await Promise.all(ids.map(id => fetchJson(`${HN}/item/${id}.json`).catch(() => null)));
    allStories = items
      .filter(s => s && !s.deleted && !s.dead)
      .map(s => ({ ...s, velocity: velocityOf(s) }));
    render();
  }

  function render() {
    const minComments = parseInt(document.getElementById('commentFilter').value);
    const sortBy = document.getElementById('sortBy').value;
    const storiesList = document.getElementById('stories');
    const loadingText = document.querySelector('.loading');
    storiesList.innerHTML = '';

    const sorters = {
      comments: (a, b) => (b.descendants || 0) - (a.descendants || 0),
      velocity: (a, b) => b.velocity - a.velocity,
      newest: (a, b) => b.time - a.time,
    };
    const stories = allStories
      .filter(s => (s.descendants || 0) >= minComments)
      .sort(sorters[sortBy]);

    for (const story of stories) {
      const listItem = document.createElement('li');

      const storyLink = document.createElement('a');
      storyLink.href = story.url || commentsUrl(story);
      storyLink.target = '_blank';
      storyLink.textContent = story.title;
      listItem.appendChild(storyLink);

      const domain = getDomainFromUrl(story.url);
      if (domain) {
        const domainText = document.createElement('span');
        domainText.className = 'domain';
        domainText.textContent = `(${domain})`;
        listItem.appendChild(domainText);
      }

      const commentsLink = document.createElement('a');
      commentsLink.href = commentsUrl(story);
      commentsLink.target = '_blank';
      commentsLink.className = 'comments-link';
      commentsLink.textContent = `(Comments: ${story.descendants})`;
      listItem.appendChild(commentsLink);

      if (story.velocity >= HOT_VELOCITY) {
        const hot = document.createElement('span');
        hot.textContent = ' 🔥';
        hot.title = `${Math.round(story.velocity)} comments/hr`;
        listItem.appendChild(hot);
      }

      const both = document.createElement('a');
      both.className = 'open-both';
      both.textContent = '[open both]';
      both.title = 'View the article with its comments below';
      both.addEventListener('click', () => openViewer(story));
      listItem.appendChild(both);

      storiesList.appendChild(listItem);
    }

    if (stories.length > 0) {
      loadingText.style.display = 'none';
    } else {
      loadingText.textContent = 'No stories with the specified minimum comments found.';
      loadingText.style.display = 'block';
    }
  }

  document.getElementById('commentFilter').addEventListener('change', render);
  document.getElementById('sortBy').addEventListener('change', render);

  loadStories();
</script>

</body>
</html>
