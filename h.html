<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker News Popular Topics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
    }
    h1 {
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
    }
    li.unseen > a:first-child {
      font-weight: bold;
    }
    a {
      text-decoration: none;
      color: #0073e6;
    }
    a:hover {
      text-decoration: underline;
    }
    .loading {
      text-align: center;
      font-size: 20px;
    }
    .comments-link {
      margin-left: 10px;
      color: #ff6600;
    }
    .domain {
      color: gray;
      font-size: 0.9em;
      margin-left: 5px;
    }
    .top-comment {
      margin: 3px 0 0;
      color: #666;
      font-size: 0.85em;
      line-height: 1.4;
      max-width: 800px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      cursor: pointer;
    }
    .top-comment.expanded {
      display: block;
      white-space: pre-line;
    }
    .top-comment .by {
      color: #999;
    }
    .open-both {
      margin-left: 10px;
      color: gray;
      font-size: 0.85em;
      cursor: pointer;
    }
    .controls {
      margin-bottom: 20px;
      text-align: center;
    }
    select {
      padding: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>Hacker News Popular Topics</h1>

<div class="controls">
  <label for="commentFilter">Minimum Comments: </label>
  <select id="commentFilter">
    <option value="50">50</option>
    <option value="100" selected>100</option>
    <option value="200">200</option>
  </select>
  <label for="sortBy" style="margin-left: 15px;">Sort: </label>
  <select id="sortBy">
    <option value="comments" selected>Comments</option>
    <option value="velocity">Velocity</option>
    <option value="newest">Newest</option>
  </select>
  <label style="margin-left: 15px;"><input type="checkbox" id="showTopComment"> Top comment</label>
</div>

<p class="loading">Loading stories...</p>
<ul id="stories"></ul>

<script>
  const HOT_VELOCITY = 40; // comments per hour (avg since posted) that earns a 🔥
  const HN = 'https://hacker-news.firebaseio.com/v0';
  const SEEN_KEY = 'hn-seen';
  const SEEN_TTL = 30 * 24 * 3600 * 1000; // forget clicks after 30 days
  let allStories = [];

  // Clicked story ids -> timestamp, kept in localStorage.
  function loadSeen() {
    try {
      const seen = JSON.parse(localStorage.getItem(SEEN_KEY)) || {};
      const cutoff = Date.now() - SEEN_TTL;
      for (const id in seen) if (seen[id] < cutoff) delete seen[id];
      return seen;
    } catch (e) {
      return {};
    }
  }
  const seen = loadSeen();

  function markSeen(story, listItem) {
    seen[story.id] = Date.now();
    listItem.classList.remove('unseen');
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
  }

  async function fetchJson(url) {
    const response = await fetch(url);
    return response.json();
  }

  function getDomainFromUrl(url) {
    try {
      return new URL(url).hostname.replace('www.', '');
    } catch (e) {
      return '';
    }
  }

  function commentsUrl(story) {
    return `https://news.ycombinator.com/item?id=${story.id}`;
  }

  // HN comment text is HTML; turn it into plain text (DOMParser never runs scripts).
  function commentToText(html) {
    const withBreaks = html.replace(/<p>/gi, '\n\n');
    return new DOMParser().parseFromString(withBreaks, 'text/html').body.textContent.trim();
  }

  // Top comment = first live child (HN returns kids in ranked order). Cached per story.
  function topCommentOf(story) {
    if (!story.topComment) {
      story.topComment = (async () => {
        for (const id of (story.kids || []).slice(0, 5)) {
          const c = await fetchJson(`${HN}/item/${id}.json`).catch(() => null);
          if (c && !c.deleted && !c.dead && c.text) return c;
        }
        return null;
      })();
    }
    return story.topComment;
  }

  function velocityOf(story) {
    const hours = Math.max((Date.now() / 1000 - story.time) / 3600, 0.25);
    return (story.descendants || 0) / hours;
  }

  async function loadStories() {
    const ids = (await fetchJson(`${HN}/topstories.json`)).slice(0, 50);
    const items = await Promise.all(ids.map(id => fetchJson(`${HN}/item/${id}.json`).catch(() => null)));
    allStories = items
      .filter(s => s && !s.deleted && !s.dead)
      .map(s => ({ ...s, velocity: velocityOf(s) }));
    render();
  }

  function render() {
    const minComments = parseInt(document.getElementById('commentFilter').value);
    const sortBy = document.getElementById('sortBy').value;
    const storiesList = document.getElementById('stories');
    const loadingText = document.querySelector('.loading');
    storiesList.innerHTML = '';

    const sorters = {
      comments: (a, b) => (b.descendants || 0) - (a.descendants || 0),
      velocity: (a, b) => b.velocity - a.velocity,
      newest: (a, b) => b.time - a.time,
    };
    const stories = allStories
      .filter(s => (s.descendants || 0) >= minComments)
      .sort(sorters[sortBy]);

    for (const story of stories) {
      const listItem = document.createElement('li');
      if (!seen[story.id]) listItem.classList.add('unseen');
      // Any click on a link (left or middle) marks the story as seen.
      const onLinkClick = e => { if (e.target.closest('a')) markSeen(story, listItem); };
      listItem.addEventListener('click', onLinkClick);
      listItem.addEventListener('auxclick', onLinkClick);

      const storyLink = document.createElement('a');
      storyLink.href = story.url || commentsUrl(story);
      storyLink.target = '_blank';
      storyLink.textContent = story.title;
      listItem.appendChild(storyLink);

      const domain = getDomainFromUrl(story.url);
      if (domain) {
        const domainText = document.createElement('span');
        domainText.className = 'domain';
        domainText.textContent = `(${domain})`;
        listItem.appendChild(domainText);
      }

      const commentsLink = document.createElement('a');
      commentsLink.href = commentsUrl(story);
      commentsLink.target = '_blank';
      commentsLink.className = 'comments-link';
      commentsLink.textContent = `(Comments: ${story.descendants})`;
      listItem.appendChild(commentsLink);

      if (story.velocity >= HOT_VELOCITY) {
        const hot = document.createElement('span');
        hot.textContent = ' 🔥';
        hot.title = `${Math.round(story.velocity)} comments/hr`;
        listItem.appendChild(hot);
      }

      const both = document.createElement('a');
      both.className = 'open-both';
      both.textContent = '[open both]';
      both.title = 'Open the article and its comments';
      // The link's own navigation opens the article (never popup-blocked);
      // the handler opens just one extra window for the comments.
      both.href = story.url || commentsUrl(story);
      both.target = '_blank';
      if (story.url) {
        both.addEventListener('click', () => window.open(commentsUrl(story), '_blank'));
      }
      listItem.appendChild(both);

      if (document.getElementById('showTopComment').checked) {
        const topComment = document.createElement('div');
        topComment.className = 'top-comment';
        topComment.title = 'Click to expand';
        topComment.addEventListener('click', () => topComment.classList.toggle('expanded'));
        topCommentOf(story).then(c => {
          if (!c) return;
          const by = document.createElement('span');
          by.className = 'by';
          by.textContent = `${c.by}: `;
          topComment.append(by, commentToText(c.text));
          listItem.appendChild(topComment);
        });
      }

      storiesList.appendChild(listItem);
    }

    if (stories.length > 0) {
      loadingText.style.display = 'none';
    } else {
      loadingText.textContent = 'No stories with the specified minimum comments found.';
      loadingText.style.display = 'block';
    }
  }

  document.getElementById('commentFilter').addEventListener('change', render);
  document.getElementById('sortBy').addEventListener('change', render);
  document.getElementById('showTopComment').addEventListener('change', render);

  loadStories();
</script>

</body>
</html>
